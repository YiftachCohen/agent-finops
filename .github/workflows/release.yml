name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          # release-check includes a reachable-history audit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Checked before the expensive gates so a mistyped tag fails in seconds.
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG does not match package.json version $VERSION" >&2
            exit 1
          }
      # Both audits are ripgrep-based and fail loudly when it is missing rather
      # than passing vacuously; the runner image does not ship it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run release-check
      - run: npm run bundle
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/agent-finops-*.tgz --generate-notes
