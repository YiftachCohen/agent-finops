name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 24 is current LTS.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # public-audit scans every commit reachable from origin branches and
          # tags; a shallow checkout would turn that into a latest-tree check.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Both audits are ripgrep-based and fail loudly when it is missing rather
      # than passing vacuously; the runner image does not ship it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # release-check runs the tests, privacy audit, public audit, and an
      # offline package-content check.
      - run: npm run release-check
